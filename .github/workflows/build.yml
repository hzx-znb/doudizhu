name: Build APK

on:
  workflow_dispatch:      # 允许在网页上手动点“Run workflow”
  push:
    branches: [main, master]

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool \
            pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            automake autopoint gettext libltdl-dev build-essential

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython<3"

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: doudizhu-apk
          path: bin/*.apk
